<html lang="en">
<head>

  ============================================================
  CINEMATIC STUDIO TEMPLATE · "Reading the Soul" edition
  Edit ONLY the SITE object at the bottom to change copy.
  Images: set `image:"images/..."` on any tile/slide/step/item;
  without one, a generated night-sky gradient stands in.
  ============================================================
-->
<style>
:root{
  color-scheme: dark;
  --bg:#000; --fg:#fff;
  --muted:rgba(255,255,255,.62); --dim:rgba(255,255,255,.38);
  --glass:rgba(255,255,255,.05); --glass-2:rgba(255,255,255,.10);
  --line:rgba(255,255,255,.15);
  --btn:#fff; --btn-fg:#111; --btn-ghost:rgba(255,255,255,.18);
  --glow-a:#2b2f7a; --glow-b:#6b4a1f;
  --gold:#d4a574;
  --font:"DM Sans","Helvetica Neue",Arial,sans-serif;
  --t-mega:clamp(56px,15vw,220px);
  --t-hero:clamp(52px,11vw,160px);
  --t-h2:clamp(40px,7vw,80px);
  --t-h4:clamp(26px,3.4vw,42px);
  --t-lead:clamp(18px,2vw,24px);
  --t-small:12px;
  --r-tile:10px; --r-frame:24px; --r-card:32px; --r-pill:999px;
  --max:1240px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
h1,h2,h3,h4,p{margin:0}
h2,h3,h4{font-weight:500;text-wrap:balance}
img{max-width:100%}
.wrap{max-width:var(--max);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
[hidden]{display:none!important}
section[id]{scroll-margin-top:60px}

.ambient{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(40vw 40vw at 8% 30%,color-mix(in srgb,var(--glow-a) 50%,transparent),transparent 70%),
  radial-gradient(45vw 45vw at 92% 75%,color-mix(in srgb,var(--glow-b) 40%,transparent),transparent 70%),var(--bg)}

/* buttons */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r-pill);padding:12px 22px;font:500 16px/1 var(--font);cursor:pointer;text-decoration:none;transition:transform .2s,background .2s}
.pill:hover{transform:translateY(-1px)}
.pill.solid{background:var(--btn);color:var(--btn-fg)}
.pill.ghost{background:var(--btn-ghost);color:var(--fg);backdrop-filter:blur(12px)}
.pill.outline{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.pill.sm{padding:8px 14px;font-size:13px}
.round{width:36px;height:36px;border-radius:50%;border:0;background:var(--glass-2);color:var(--fg);display:grid;place-items:center;cursor:pointer;font-size:16px}
.round:hover{background:rgba(255,255,255,.2)}
.eyebrow{display:block;color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:linear-gradient(#000c,#0000)}
.nav .wrap{display:flex;align-items:center;gap:24px;height:56px}
.brand{font-weight:500;font-size:22px;letter-spacing:-.02em;text-decoration:none;white-space:nowrap}
.nav ul{display:flex;gap:28px;list-style:none;margin:0 auto;padding:0}
.nav ul a{font-size:13px;color:var(--muted);text-decoration:none}
.nav ul a:hover{color:var(--fg)}
@media (max-width:820px){.nav ul{display:none}.nav .pill{margin-left:auto}}

/* hero */
.hero{position:relative;padding-top:12px;overflow:hidden}
.mosaic{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:clamp(48px,9vw,112px);gap:8px;padding:0 8px}
.tile{border-radius:var(--r-tile);background-size:cover;background-position:center;animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{filter:brightness(1.22) saturate(1.2)}}
.hero-word{position:absolute;left:0;right:0;top:clamp(80px,22vw,300px);text-align:center;font-size:var(--t-hero);font-weight:500;letter-spacing:-.04em;line-height:.9;text-shadow:0 8px 60px #0009;pointer-events:none;padding:0 12px}
.hero-foot{position:relative;margin-top:-120px;padding:120px 16px 28px;background:linear-gradient(#0000,#000 55%);text-align:center;display:grid;justify-items:center;gap:18px}
.hero-foot .tag{font-size:var(--t-lead);font-weight:500;line-height:1.2;max-width:24ch}
.fine{font-size:var(--t-small);color:var(--muted);line-height:1.6;max-width:70ch}
.chev{color:var(--muted);font-size:14px}
.pause{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:28px}

/* sections */
section{padding-block:clamp(72px,10vw,140px)}
.head{text-align:center;display:grid;justify-items:center;gap:20px;margin-bottom:clamp(36px,5vw,64px)}
.head h2,.head h3{font-size:var(--t-h2);line-height:1.02;letter-spacing:-.04em}
.lead{font-size:var(--t-lead);line-height:1.33;letter-spacing:-.035em;max-width:36ch}
.lead.soft{font-size:17px;letter-spacing:-.01em;color:var(--muted);max-width:56ch;line-height:1.6}

/* dream-journal frame */
.frame{border-radius:var(--r-frame);background:#0d0d0f;box-shadow:inset 0 0 0 1px var(--line),0 40px 120px #000;padding:14px;display:grid;grid-template-columns:44px 1fr 30%;gap:12px;aspect-ratio:16/9}
.frame .rail{display:grid;align-content:start;gap:12px;padding-top:30px}
.frame .rail i{display:block;width:18px;height:18px;border-radius:6px;background:var(--glass-2);margin:auto}
.frame .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start;padding-top:30px;min-width:0}
.frame .grid div{aspect-ratio:16/10;border-radius:8px;background-size:cover}
.frame .side{border-radius:14px;background:var(--glass);padding:14px;display:grid;align-content:start;gap:10px;font-size:12px;color:var(--muted);min-width:0}
.frame .side b{color:var(--fg);font-weight:500;font-size:13px}
.frame .side .bub{background:var(--glass-2);border-radius:10px;padding:10px;color:var(--fg);line-height:1.45}
.frame .side .bub small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.frame .side .bub.new{box-shadow:inset 0 0 0 1px rgba(212,165,116,.5)}
.frame .side .bub.new small{color:var(--gold)}
@media (max-width:700px){.frame{grid-template-columns:1fr;aspect-ratio:auto}.frame .rail{display:none}.frame .grid{padding-top:8px}}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:40px}
.stat{text-align:center;padding:28px 24px;border-radius:var(--r-frame);background:var(--glass);border:1px solid var(--line)}
.stat small{display:block;color:var(--dim);font-size:12px;letter-spacing:.14em;font-weight:700}
.stat b{display:block;font-size:clamp(34px,4.6vw,52px);font-weight:500;letter-spacing:-.04em;color:var(--gold);margin:4px 0}
.stat span{font-size:14px;color:var(--muted)}

/* carousel */
.track{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-inline:8vw}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 min(84vw,1040px);scroll-snap-align:center;aspect-ratio:16/9;border-radius:var(--r-frame);position:relative;overflow:hidden;display:grid;place-items:center;text-align:center;padding:24px;background-size:cover;background-position:center}
.slide::before{content:"";position:absolute;inset:0;backdrop-filter:blur(30px);background:#0004}
.slide>div{position:relative;display:grid;justify-items:center;gap:14px}
.slide .kind{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.slide h3{font-size:var(--t-h2);line-height:1;letter-spacing:-.042em}
.slide .price{font-size:clamp(22px,2.4vw,30px);font-weight:500;letter-spacing:-.03em}
.slide p{font-size:clamp(14px,1.4vw,17px);line-height:1.6;max-width:44ch;color:#ffffffd9}
.slide .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.arrows{display:flex;gap:6px;justify-content:flex-end;margin-top:18px}
@media (max-width:600px){.slide{aspect-ratio:3/4}}

/* process mega words */
.step{position:relative;padding-bottom:clamp(40px,6vw,80px)}
.step h3{font-size:var(--t-mega);line-height:.85;letter-spacing:-.045em;position:sticky;top:56px;z-index:0;opacity:.95}
.step:nth-child(even) h3{text-align:right}
.step .stage{position:relative;z-index:1;margin-top:clamp(-60px,-6vw,-20px);display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:20px;align-items:center}
.step:nth-child(even) .stage{grid-template-columns:minmax(0,1fr) minmax(0,280px)}
.step:nth-child(even) .callout{order:2}
.callout{background:#121214e6;border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:10px;backdrop-filter:blur(16px)}
.callout small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.callout b{font-weight:500;font-size:17px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.callout p{font-size:14px;line-height:1.55;color:var(--muted)}
.panel{border-radius:var(--r-frame);aspect-ratio:16/9;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px var(--line);position:relative;overflow:hidden}
.panel .prompt{position:absolute;left:8%;right:8%;bottom:10%;background:#000b;border-radius:16px;padding:14px 16px;font-size:14px;color:var(--fg);backdrop-filter:blur(10px);display:flex;justify-content:space-between;gap:10px}
.cap{margin-top:14px;font-size:14px;color:var(--muted)}
@media (max-width:760px){.step .stage,.step:nth-child(even) .stage{grid-template-columns:1fr}.step:nth-child(even) .callout{order:0}}

/* quote band */
.band{text-align:center}
.band blockquote{margin:0 auto;font-size:var(--t-h2);line-height:1.02;letter-spacing:-.04em;font-weight:500;max-width:18ch;text-wrap:balance}
.band blockquote em{font-style:normal;color:var(--gold)}
.band p{margin-top:24px;color:var(--muted);font-size:14px}

/* story */
#story{position:relative;overflow:hidden;background-size:cover;background-position:center}
#story::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,#000a 0%,#000e 70%)}
#story .wrap{position:relative}
.story{text-align:center;display:grid;gap:22px;justify-items:center}
.story p{font-size:var(--t-h4);line-height:1.14;letter-spacing:-.035em;font-weight:500;max-width:24ch}
.story p.soft{color:var(--muted);font-weight:400}
.story p.gold{color:var(--gold);font-size:var(--t-h2);line-height:1}
.story .num{font-size:12px;letter-spacing:.2em;color:var(--dim);font-weight:700;margin-bottom:-12px}

/* tools: preview + list */
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.preview{position:sticky;top:76px;aspect-ratio:4/5;border-radius:var(--r-frame);background-size:cover;background-position:center;display:grid;place-items:center;overflow:hidden;transition:background .6s}
.preview span{font-size:clamp(28px,4vw,52px);font-weight:500;letter-spacing:-.03em;text-shadow:0 6px 30px #0008;padding:24px;text-align:center}
.list{background:var(--glass);border:1px solid var(--line);border-radius:var(--r-frame);padding:8px 24px;min-width:0}
.item{display:grid;grid-template-columns:auto 1fr;align-items:start;gap:16px;padding:22px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border:0}
.item em{font-style:normal;font-size:12px;letter-spacing:.14em;font-weight:700;color:var(--dim);padding-top:12px;transition:color .25s}
.item h4{font-size:var(--t-h4);line-height:1.15;letter-spacing:-.03em;color:var(--dim);transition:color .25s}
.item p{font-size:14px;color:var(--dim);margin-top:6px;line-height:1.55}
.item.on h4,.item:hover h4{color:var(--fg)}
.item.on em{color:var(--gold)}
.item.on p{color:var(--muted)}
.priv-cta{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:32px}
.priv-cta b{font-size:30px;font-weight:500;letter-spacing:-.03em}
.priv-cta span{color:var(--muted);font-size:14px}
@media (max-width:760px){.split{grid-template-columns:1fr}.preview{position:relative;top:0;aspect-ratio:16/10}}

/* pricing */
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.plan{background:var(--glass);border:1px solid var(--line);border-radius:var(--r-card);padding:28px 22px;display:grid;align-content:start;gap:16px}
.plan.hi{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3)}
.plan h3{font-size:13px;color:var(--muted);font-weight:500}
.plan .price{font-size:34px;font-weight:500;letter-spacing:-.03em;text-align:center;font-variant-numeric:tabular-nums}
.plan .price small{font-size:15px;color:var(--muted)}
.plan .promise{font-size:15px;line-height:1.45;text-align:center;min-height:3em}
.plan .pill{background:rgba(255,255,255,.75);color:var(--btn-fg)}
.plan.hi .pill{background:var(--btn)}
.plan ul{list-style:none;padding:0;margin:0;display:grid;gap:10px;font-size:13px;color:var(--muted)}
.plan li{padding-left:22px;position:relative}
.plan li::before{content:"✓";position:absolute;left:0;color:var(--fg)}
@media (max-width:860px){.plans{grid-template-columns:1fr}}

/* guide signup */
.contact{text-align:center;display:grid;gap:22px;justify-items:center}
.cover{width:min(260px,70vw);aspect-ratio:4/5;border-radius:var(--r-frame);background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px var(--line),0 40px 120px #000;display:grid;place-items:center;padding:20px;text-align:center}
.cover b{font-size:26px;font-weight:500;letter-spacing:-.03em;line-height:1.05;text-shadow:0 4px 24px #0008}
.cover small{display:block;color:var(--muted);font-size:11px;margin-top:10px}
.form{max-width:560px;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left}
.form .full{grid-column:1/-1}
.form label{display:block;font-size:12px;font-weight:500;margin-bottom:6px}
.form input{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:var(--fg);padding:0 14px;font:inherit}
.form input::placeholder{color:var(--dim)}
.form input:focus{outline:none;border-color:rgba(255,255,255,.5)}
.form .error{border-color:#e05a5a}
.toast{display:none;font-size:14px;padding:12px 16px;border-radius:12px;text-align:center}
.toast.ok{display:block;background:#ffffff14;color:var(--fg)}
.toast.bad{display:block;background:#e05a5a1f;color:#f09090}
@media (max-width:640px){.form{grid-template-columns:1fr}}

footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:24px 32px;font-size:11px;color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="ambient" aria-hidden="true"></div>
<a class="vh" href="#main">Skip to main content</a>

<header class="nav"><div class="wrap">
  <a class="brand" id="brand" href="#top"></a>
  <ul id="navlinks"></ul>
  <a class="pill solid sm" href="#guide">Free app</a>
</div></header>

<main id="main">
  <div class="hero" id="top">
    <h1 class="vh" id="h1"></h1>
    <div class="mosaic" id="mosaic" aria-hidden="true"></div>
    <div class="hero-word" id="heroWord" aria-hidden="true"></div>
    <div class="hero-foot">
      <p class="tag" id="tagline"></p>
      <a class="pill solid" id="heroCta" href="#guide"></a>
      <p class="fine" id="heroFine"></p>
      <span class="chev" aria-hidden="true">⌄</span>
      <button class="round pause" id="pause" aria-label="Pause background motion">❚❚</button>
    </div>
  </div>

  <section id="method"><div class="wrap">
    <div class="head"><span class="eyebrow" id="showEyebrow"></span><h2 id="showTitle"></h2><p class="lead" id="showLead"></p></div>
    <div class="frame" id="frame" aria-label="Dream journal preview"></div>
    <div class="stats" id="stats"></div>
  </div></section>

  <section id="process"><div class="wrap">
    <div class="head"><span class="eyebrow">What you gain</span><h3 id="procTitle"></h3></div>
    <div id="steps"></div>
  </div></section>

  <section class="band"><div class="wrap">
    <blockquote id="bandQuote"></blockquote>
    <p id="bandCap"></p>
  </div></section>

  <section id="story"><div class="wrap story" id="storyBody"></div></section>

  <section id="offerings">
    <div class="wrap head"><span class="eyebrow">Work with me</span><h3 id="offTitle"></h3><p class="lead" id="offLead"></p></div>
    <div class="car"><div class="track" id="track"></div>
      <div class="wrap arrows"><button class="round" id="prev" aria-label="Previous">‹</button><button class="round" id="next" aria-label="Next">›</button></div>
    </div>
  </section>

  <section id="private"><div class="wrap">
    <div class="head"><span class="eyebrow">Private sessions</span><h3 id="privTitle"></h3><p class="lead soft" id="privLead"></p></div>
    <div class="split"><div class="preview" id="preview"><span id="previewLabel"></span></div><div class="list" id="privList"></div></div>
    <div class="priv-cta"><b id="privPrice"></b><span id="privUnit"></span><a class="pill solid" href="#guide" id="privCta"></a></div>
    <p class="fine" id="privFit" style="text-align:center;margin:18px auto 0"></p>
  </div></section>

  <section id="pricing"><div class="wrap">
    <div class="head"><h3 id="priceTitle"></h3><p class="lead" id="priceLead" style="font-size:18px;max-width:40ch"></p></div>
    <div class="plans" id="plans"></div>
  </div></section>

  <section id="guide"><div class="wrap contact">
    <div class="cover" id="cover"><div><b id="coverTitle"></b><small>Image placeholder: app preview</small></div></div>
    <span class="eyebrow">Free app &amp; journal</span>
    <div class="head" style="margin:0"><h3 id="guideTitle"></h3><p class="lead soft" id="guideLead"></p></div>
    <form class="form" id="signup" novalidate>
      <div><label for="name">First name</label><input id="name" autocomplete="given-name" placeholder="Your name"></div>
      <div><label for="email">Email *</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div>
      <div class="full" style="text-align:center;margin-top:6px"><button class="pill solid" type="submit">Send me the free app</button></div>
      <div class="full toast" id="toast"></div>
    </form>
    <p class="fine" id="guideFine"></p>
  </div></section>
</main>

<footer><div class="wrap"><span id="footL"></span><span id="footR"></span></div></footer>

<script>

  processTitle: "Four ways your dreams work for you.",

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let seed = 11; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
function art(img){
  if (img) return `url("${img}")`;
  const [h1,h2] = SITE.hue, h = h1 + (h2 - h1) * rnd(), h3 = h + 50 * (rnd() - .5);
  const l = 14 + rnd() * 26;
  const gold = rnd() < .22; // occasional dusk-gold glint, like light in a dream
  const spot = gold ? `hsl(32 60% ${l+30}% / .85)` : `hsl(${h3} 65% ${l+28}% / .9)`;
  return `radial-gradient(circle at ${rnd()*100}% ${rnd()*100}%, ${spot}, transparent 55%),
          linear-gradient(${rnd()*360}deg, hsl(${h} 50% ${l}%), hsl(${h3} 40% ${l*0.45}%))`;
}
const bg = (el, img) => el.style.backgroundImage = art(img);

document.documentElement.style.setProperty("--glow-a", SITE.glow[0]);
document.documentElement.style.setProperty("--glow-b", SITE.glow[1]);
$("brand").textContent = SITE.brand; $("h1").textContent = "Reading the Soul · " + SITE.brand;
$("navlinks").innerHTML = SITE.nav.map(([n,id])=>`<li><a href="#${id}">${esc(n)}</a></li>`).join("");

/* Hero mosaic */
const spans = [[1,1],[1,1],[3,1],[3,1],[2,1],[1,1],[1,1],[3,2],[3,2],[2,2],[4,2],[1,2],[1,1],[2,1],[2,1],[2,1],[1,1],[2,1],[3,1],[1,1],[2,1],[2,1],[3,1],[1,1],[2,1],[2,1],[4,1],[2,1],[2,1],[2,1],[1,1],[3,1],[2,1],[1,1]];
const tiles = SITE.hero.tiles;
$("mosaic").innerHTML = tiles.map((_,i)=>{const [c,r]=spans[i%spans.length];return `<div class="tile" style="grid-column:span ${c};grid-row:span ${r};animation-delay:${-i*1.3}s"></div>`}).join("");
[...$("mosaic").children].forEach((t,i)=>bg(t,tiles[i]));
$("heroWord").textContent = SITE.hero.word;
$("tagline").textContent = SITE.hero.tagline;
$("heroCta").textContent = SITE.hero.cta;
$("heroFine").textContent = SITE.hero.fine;
let paused = false;
$("pause").onclick = () => { paused = !paused; document.querySelectorAll(".tile").forEach(t=>t.style.animationPlayState = paused?"paused":"running"); $("pause").textContent = paused?"▶":"❚❚"; };

/* Method: dream-journal frame */
const S = SITE.showcase;
$("showEyebrow").textContent = S.eyebrow; $("showTitle").textContent = S.title; $("showLead").textContent = S.lead;
$("frame").innerHTML = `<div class="rail">${"<i></i>".repeat(6)}</div><div class="grid">${"<div></div>".repeat(9)}</div>
  <div class="side"><b>${esc(S.panelTitle)}</b>
    <div class="bub"><small>${esc(S.old.label)}</small>${esc(S.old.q)}<br><span style="color:var(--dim)">${esc(S.old.note)}</span></div>
    <div class="bub new"><small>${esc(S.neu.label)}</small>${esc(S.neu.q)}<br><span style="color:var(--muted)">${esc(S.neu.note)}</span></div>
  </div>`;
$("frame").querySelectorAll(".grid div").forEach(d=>bg(d));
$("stats").innerHTML = SITE.stats.map(x=>`<div class="stat"><small>${esc(x.k)}</small><b>${esc(x.n)}</b><span>${esc(x.t)}</span></div>`).join("");

/* Process */
$("procTitle").textContent = SITE.processTitle;
$("steps").innerHTML = SITE.process.map(p=>`<div class="step"><h3>${esc(p.word)}</h3><div class="stage">
  <div class="callout"><small>${esc(p.kicker)}</small><b>${esc(p.card)}</b><p>${esc(p.text)}</p></div>
  <div><div class="panel"><div class="prompt"><span>${esc(p.prompt)}</span><span aria-hidden="true">→</span></div></div><p class="cap">${esc(p.caption)}</p></div>
</div></div>`).join("");
$("steps").querySelectorAll(".panel").forEach((p,i)=>bg(p,SITE.process[i].image));

/* Quote band */
$("bandQuote").innerHTML = SITE.band.quote; $("bandCap").textContent = SITE.band.cap;

/* Story */
const ST = SITE.story;
bg($("story"), ST.image);
$("storyBody").innerHTML = `<span class="eyebrow">${esc(ST.eyebrow)}</span>
  <div class="head" style="margin:0 0 20px"><h2>${esc(ST.title)}</h2></div>` +

    `<span class="num">${esc(b.n)}</span><p class="${b.soft?"soft":""}">${esc(b.t)}</p>`).join("");

/* Offerings carousel */
$("offTitle").textContent = SITE.offerings.title; $("offLead").textContent = SITE.offerings.lead;
$("track").innerHTML = SITE.offerings.items.map(o=>`<article class="slide"><div><span class="kind">${esc(o.kind)}</span><h3>${esc(o.title)}</h3><div class="price">${esc(o.price)}</div><p>${esc(o.text)}</p>
  <div class="btns"><a class="pill solid sm" href="${o.href}">${esc(o.cta)}</a><a class="pill ghost sm" href="${o.moreHref}">${esc(o.more)}</a></div></div></article>`).join("");
[...$("track").children].forEach((s,i)=>bg(s,SITE.offerings.items[i].image));
const stepW = () => $("track").firstElementChild.offsetWidth + 16;
$("prev").onclick = () => $("track").scrollBy({left:-stepW(),behavior:"smooth"});
$("next").onclick = () => $("track").scrollBy({left: stepW(),behavior:"smooth"});

/* Private sessions: preview + list */
const PV = SITE.private;
$("privTitle").textContent = PV.title; $("privLead").textContent = PV.lead;
$("privPrice").textContent = PV.price; $("privUnit").textContent = PV.unit; $("privCta").textContent = PV.cta; $("privFit").textContent = PV.fit;
const pvArt = PV.items.map(t=>art(t.image));
$("privList").innerHTML = PV.items.map((t,i)=>`<div class="item${i?"":" on"}" data-i="${i}" tabindex="0"><em>${String(i+1).padStart(2,"0")}</em><div><h4>${esc(t.title)}</h4><p>${esc(t.text)}</p></div></div>`).join("");
function pick(i){ document.querySelectorAll(".item").forEach(x=>x.classList.toggle("on", +x.dataset.i===i)); $("preview").style.backgroundImage = pvArt[i]; $("previewLabel").textContent = PV.items[i].title; }
document.querySelectorAll(".item").forEach(x=>{ const i=+x.dataset.i; x.onmouseenter = x.onfocus = x.onclick = () => pick(i); });
pick(0);

/* Pricing */
const P = SITE.pricing;
$("priceTitle").textContent = P.title; $("priceLead").textContent = P.lead;
$("plans").innerHTML = P.plans.map(p=>`<div class="plan${p.featured?" hi":""}"><h3>${esc(p.name)}</h3><div class="price">${esc(p.price)}<small>${esc(p.unit)}</small></div>
  <p class="promise">${esc(p.promise)}</p><a class="pill" href="${p.href}">${esc(p.cta)}</a><ul>${p.features.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div>`).join("");

/* Guide signup (design preview — connect to your email provider) */
const G = SITE.guide;
bg($("cover"), G.cover); if (G.cover) $("cover").innerHTML = "";
$("coverTitle").textContent = G.coverTitle; $("guideTitle").textContent = G.title; $("guideLead").textContent = G.lead; $("guideFine").textContent = G.fine;
$("signup").addEventListener("submit", e => {
  e.preventDefault();
  const em = $("email"), t = $("toast");
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em.value.trim())) { em.classList.add("error"); t.className="full toast bad"; t.textContent="Please enter a valid email address."; return; }
  em.classList.remove("error"); t.className="full toast ok"; t.textContent="Thank you. This form is a design preview, so nothing was sent.";
});

$("footL").textContent = SITE.footer[0]; $("footR").textContent = SITE.footer[1];
</script>
