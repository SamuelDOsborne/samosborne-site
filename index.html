<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1a1a1a" />
  <title>Healthcare Keynote Speaker on Composure | Sam Osborne</title>
  <meta name="description" content="Healthcare keynote speaker for nurse leaders and care teams. Sam Osborne shows how to stay calm with upset patients and families, live on stage." />
  <link rel="canonical" href="https://samosborne.net/" />

  <meta property="og:description" content="The healthcare keynote where a volunteer's real conflict dissolves on stage. For nurse leaders, health systems and care teams. 95% rated his delivery excellent." />
  <meta property="og:image" content="https://samosborne.net/images/opt/og-home.jpg" />

  <meta property="og:url" content="https://samosborne.net/" />
  <meta property="og:type" content="website" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Healthcare Keynote Speaker on Composure | Sam Osborne" />
  <meta name="twitter:description" content="The healthcare keynote where a real conflict dissolves on stage, live. For nurse leaders, health systems and care teams." />
  <meta name="twitter:image" content="https://samosborne.net/images/opt/og-home.jpg" />

  <link rel="preload" as="image" href="images/opt/private-sessions-hero.jpg" fetchpriority="high">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #1a1a1a;
      --bg-2: #232323;
      --text: #f5f5f7;
      --muted: rgba(245,245,247,.66);
      --muted-2: rgba(245,245,247,.42);
      --gold: #d4a574;
      --slate: #4a5e7f;
      --warm: #f5f3f0;
      --ink: #1d1d1f;
      --line: rgba(255,255,255,.08);
      --line-dark: rgba(0,0,0,.08);
      --card: rgba(255,255,255,.04);
      --radius: 22px;
      --shadow: 0 18px 60px rgba(0,0,0,.16);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }
    .container { width: min(1200px, calc(100% - 40px)); margin: 0 auto; }
    .section { padding: 88px 0; }

    section[id], [id="top"] { scroll-margin-top: 76px; }
    .section-light { background: var(--warm); color: var(--ink); }
    .eyebrow {
      display: inline-block;
      margin-bottom: 14px;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: .14em;
      font-size: 11px;
      font-weight: 700;
    }
    .section-light .eyebrow { color: var(--slate); }
    h1,h2,h3,p { margin: 0; }
    h1 {
      font-size: clamp(2rem, 4.1vw, 3.4rem);
      line-height: 1.08;
      letter-spacing: -.04em;
      font-weight: 800;
    }
    .h1-short { display: none; }
    .kicker-break { display: none; }
    h2 {
      font-size: clamp(2rem, 4.8vw, 4.5rem);
      line-height: 1.05;
      letter-spacing: -.04em;
      font-weight: 800;
    }
    h3 {
      font-size: 1.15rem;
      line-height: 1.12;
      letter-spacing: -.02em;
      font-weight: 700;
    }
    .lede {
      font-size: clamp(1rem, 1.5vw, 1.15rem);
      color: var(--muted);
      max-width: 40ch;
    }
    .lede-dark {
      font-size: clamp(1rem, 1.5vw, 1.15rem);
      color: rgba(29,29,31,.68);
      max-width: 56ch;
    }
    .btn-row { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 28px; }
    .btn-primary, .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 24px;
      border-radius: 999px;
      font-weight: 700;
      letter-spacing: -.01em;
      transition: .22s ease;
      border: 1px solid transparent;
      cursor: pointer;
      font-family: inherit;
      font-size: 1rem;
    }
    .btn-primary { background: var(--gold); color: #1A1A1A; }
    .btn-primary:hover { transform: translateY(-1px); background: #E8C497; }
    .btn-secondary { color: var(--text); border-color: rgba(255,255,255,.16); background: transparent; }
    .btn-secondary:hover { border-color: var(--gold); color: var(--gold); }

    nav {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(18px) saturate(180%);
      background: rgba(20,20,20,.88);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .nav-inner {
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      position: relative;
    }
    .nav-brand { font-weight: 800; letter-spacing: .02em; font-size: 1.1rem; color: var(--gold); white-space: nowrap; }
    .nav-links { display: flex; gap: 16px; color: rgba(245,245,247,.86); font-size: 13.5px; white-space: nowrap; }
    .nav-links a:hover, .nav-cta:hover { color: var(--gold); }
    .nav-right { display: flex; align-items: center; gap: 18px; }
    .nav-phone { color: #f5f5f7; font-size: 14px; font-weight: 600; white-space: nowrap; transition: color .18s ease; }
    .nav-phone:hover { color: var(--gold); }
    .nav-cta { color: var(--gold); font-size: 14px; font-weight: 600; white-space: nowrap; }
    .mobile-toggle {
      display: none;
      background: none;
      border: 1px solid rgba(255,255,255,.24);
      color: #f5f5f7;
      font-size: 20px;
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      line-height: 1;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr 0.85fr;
      align-items: center;
      min-height: calc(100vh - 56px);
    }
    .hero-image {
      position: relative;
      align-self: stretch;
      min-height: 520px;
      order: 1;
      background:
        linear-gradient(90deg, rgba(245,243,240,0) 54%, rgba(245,243,240,.98) 100%),
        linear-gradient(180deg, rgba(0,0,0,.05) 0%, rgba(0,0,0,.12) 100%),
        url('images/opt/private-sessions-hero.jpg') center center/cover no-repeat;
    }
    .hero-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 84px 0 72px;
      background: var(--warm);
      color: var(--ink);
      align-self: stretch;
      order: 2;
    }
    .hero-copy h1 { color: var(--ink); }
    .hero-copy .eyebrow { color: var(--slate); }
    .hero-reel {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 40px 40px 0;
    }
    .hero-reel-inner { width: 100%; max-width: 820px; }
    .hero-reel-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid rgba(212,165,116,.22);
      box-shadow: 0 30px 80px rgba(0,0,0,.4), 0 0 0 1px rgba(212,165,116,.04) inset;
      background: #0d0d0d;
    }
    .hero-reel-frame iframe {
      position: absolute; inset: 0;
      width: 100%; height: 100%; border: 0;
    }

    .reel-fallback {
      margin: 10px 0 0; text-align: center;
      font-size: .8rem; line-height: 1.5; color: var(--muted-2);
    }
    .reel-fallback a {
      color: var(--muted); text-decoration: underline; text-underline-offset: 2px;
    }
    .reel-fallback a:hover { color: var(--gold); }
    .hero-reel-label {
      margin-bottom: 22px;
      text-align: center;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: .2em;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .hero-reel-label::before,
    .hero-reel-label::after {
      content: "";
      height: 1px;
      width: 36px;
      background: rgba(212,165,116,.45);
    }
    .hero-copy .inner { width: min(700px, calc(100% - 40px)); margin: 0 auto; }
    .hero-kicker {
      color: var(--slate);
      text-transform: uppercase;
      letter-spacing: .13em;
      font-size: clamp(.9rem, 1.3vw, 1.15rem);
      font-weight: 600;
      margin-bottom: 16px;
    }
    .proof-line {
      margin-bottom: 16px;
      color: rgba(245,245,247,.78);
      font-size: .95rem;
      font-weight: 500;
    }
    .hero-rule {
      width: 40px;
      height: 1px;
      background: rgba(212,165,116,.54);
      margin: 22px 0;
    }
    .hero-sub {
      max-width: 39ch;
      font-size: clamp(1rem, 1.35vw, 1.16rem);
      line-height: 1.62;
      color: rgba(29,29,31,.72);
    }
    .hero-award {
      margin-top: 14px;
      color: var(--muted-2);
      font-size: .92rem;
      max-width: 42ch;
      line-height: 1.6;
    }

    .reel-section {
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      padding: 64px 0 72px;
    }
    .reel-section .hero-reel-inner { max-width: 900px; margin: 0 auto; }

    .marquee {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      overflow: hidden;
      white-space: nowrap;
      padding: 14px 0;
    }
    .marquee-track {
      display: inline-flex;
      gap: 34px;
      min-width: 200%;
      animation: marquee 30s linear infinite;
      color: rgba(245,245,247,.32);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .14em;
      font-weight: 600;
    }
    @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @keyframes heroTextIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .hero-copy { animation: none !important; opacity: 1 !important; transform: none !important; }
    }

    .endorsement {
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }
    .endorsement::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 18% 20%, rgba(212,165,116,.08) 0%, transparent 42%),
        radial-gradient(circle at 82% 80%, rgba(74,94,127,.10) 0%, transparent 46%);
      pointer-events: none;
    }
    .endorsement .container {
      position: relative;
      z-index: 1;
    }
    .endorsement-header { text-align: center; margin-bottom: 20px; max-width: min(1080px, 100%); margin-left: auto; margin-right: auto; }
    .endorsement-header h2 { max-width: 18ch; margin: 0 auto; font-size: clamp(1.6rem, 3vw, 2.4rem); }

    .endorsement-layout {
      display: grid;
      grid-template-columns: 0.85fr 1.15fr;
      gap: 36px;
      align-items: center;
      margin-top: 48px;
    }
    .endorsement-photo {
      border-radius: 22px;
      overflow: hidden;
      height: 100%;
      min-height: 480px;
      box-shadow: 0 30px 80px rgba(0,0,0,.4);
    }
    .endorsement-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
    }

    .endorsement-card {
      position: relative;
      padding: clamp(32px, 4vw, 56px) clamp(24px, 4vw, 48px);
      border-radius: 22px;
      border: 1px solid rgba(212,165,116,.22);
      background: linear-gradient(180deg, rgba(255,255,255,.035) 0%, rgba(255,255,255,.015) 100%);
      box-shadow: 0 30px 80px rgba(0,0,0,.4), 0 0 0 1px rgba(212,165,116,.04) inset;
    }
    .credential-mark {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 32px;
      padding-bottom: 28px;
      border-bottom: 1px solid rgba(212,165,116,.18);
    }
    .credential-seal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1.5px solid rgba(212,165,116,.5);
      color: var(--gold);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
    }
    .credential-label {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .22em;
      font-weight: 600;
    }
    .endorsement-quote {
      margin: 0 0 36px 0;
      font-size: clamp(1.25rem, 2.2vw, 1.85rem);
      line-height: 1.32;
      letter-spacing: -.025em;
      color: rgba(245,245,247,.94);
      font-weight: 500;
      text-align: center;
      max-width: 30ch;
      margin-left: auto;
      margin-right: auto;
    }
    .endorsement-quote::before {
      content: "\201C";
      display: block;
      font-size: 4rem;
      line-height: .6;
      color: var(--gold);
      opacity: .55;
      margin-bottom: 18px;
      font-family: Georgia, serif;
    }
    .endorsement-attribution { text-align: center; padding-top: 28px; border-top: 1px solid rgba(255,255,255,.06); }
    .endorsement-name { font-size: 1.05rem; font-weight: 700; color: var(--text); letter-spacing: -.01em; margin-bottom: 4px; }
    .endorsement-title { color: var(--gold); font-size: .88rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
    .endorsement-meta {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px dashed rgba(255,255,255,.08);
      display: flex;
      justify-content: center;
      gap: clamp(20px, 4vw, 48px);
      flex-wrap: wrap;
      text-align: center;
    }
    .endorsement-meta-item { color: var(--muted-2); font-size: .82rem; letter-spacing: .04em; }
    .endorsement-meta-item strong {
      display: block;
      color: var(--gold);
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -.02em;
      margin-bottom: 4px;
    }
    .endorsement-friday {
      margin-top: 12px;
      text-align: center;
      color: var(--muted-2);
      font-size: .82rem;
      font-style: italic;
      letter-spacing: .02em;
    }

    .intro { padding: 74px 0 58px; text-align: center; }
    .intro h2 { max-width: 10ch; margin: 0 auto 22px; }
    .intro p { max-width: 44ch; margin: 0 auto; }
    .positioning-box {
      margin-top: 30px;
      border: 1px solid var(--line-dark);
      background: rgba(255,255,255,.72);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 34px rgba(0,0,0,.06);
      max-width: 860px;
      margin-inline: auto;
    }
    .positioning-box p {
      font-size: clamp(1.05rem, 1.55vw, 1.3rem);
      line-height: 1.5;
      color: var(--ink);
      letter-spacing: -.02em;
      max-width: 48ch;
      margin: 0 auto;
    }

    .principles {
      background: var(--bg-2);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 96px 0;
      position: relative;
      overflow: hidden;
    }
    .principles::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 8%, rgba(212,165,116,.08) 0%, transparent 55%);
    }
    .principles .container { position: relative; z-index: 1; text-align: center; }
    .principles .eyebrow { margin-bottom: 10px; }
    .principles-lead {
      color: var(--muted);
      font-size: clamp(1rem, 1.5vw, 1.15rem);
      max-width: 42ch;
      margin: 0 auto 52px;
    }
    .principles-stack { max-width: 820px; margin: 0 auto; }
    .principle {
      padding: 30px 0;
      border-top: 1px solid rgba(212,165,116,.16);
      font-size: clamp(1.45rem, 3.1vw, 2.55rem);
      font-weight: 800;
      letter-spacing: -.04em;
      line-height: 1.1;
      color: var(--text);
    }
    .principle:first-of-type { border-top: none; }
    .principle em { color: var(--gold); font-style: normal; }

    .principle em { white-space: nowrap; }

    .grid-2, .grid-3, .grid-4 { display: grid; gap: 16px; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .card {
      border-radius: var(--radius);
      padding: 30px;
      background: rgba(255,255,255,.86);
      border: 1px solid rgba(0,0,0,.08);
      box-shadow: var(--shadow);
      color: var(--ink);
    }
    .card.dark {
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--text);
      box-shadow: none;
      position: relative;
      overflow: hidden;
    }
    .card p { margin-top: 10px; color: rgba(29,29,31,.68); }
    .card.dark p { color: var(--muted); }
    .card img.keynote-art {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 16px;
      margin-bottom: 18px;
      background: #0d0d0d;
    }
    .card .formats {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(0,0,0,.08);
      font-size: .82rem;
      color: var(--slate);
      font-weight: 600;
      letter-spacing: .02em;
      font-style: italic;
    }
    .card ul { margin: 14px 0 0; padding-left: 18px; color: rgba(29,29,31,.72); }
    .card.dark ul { color: var(--muted); }
    .card li { margin-bottom: 9px; }
    .inline-link { color: var(--gold); text-decoration: underline; text-decoration-color: rgba(212,165,116,.45); text-underline-offset: 3px; }
    .inline-link:hover { text-decoration-color: var(--gold); }
    .card:not(.dark) .inline-link { color: var(--slate); text-decoration-color: rgba(74,94,127,.45); }

    .method-echo {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .14;
      background:
        radial-gradient(circle at 50% 50%, rgba(212,165,116,.32) 0%, rgba(212,165,116,.14) 14%, rgba(212,165,116,0) 36%),
        linear-gradient(90deg, rgba(212,165,116,0) 0%, rgba(212,165,116,.24) 50%, rgba(212,165,116,0) 100%);
      filter: blur(1px);
    }
    .method-card-content { position: relative; z-index: 1; }

    .method-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr));
      gap: 20px;
      margin-top: 36px;
    }
    .method-grid .card { padding: 36px; }
    .method-grid h3 { font-size: 1.35rem; }
    .method-grid p { margin-top: 14px; font-size: 1.05rem; line-height: 1.65; }
    @media (max-width: 620px) {
      .method-grid { gap: 16px; margin-top: 28px; }
      .method-grid .card { padding: 26px 22px; }
      .method-grid h3 { font-size: 1.2rem; }
      .method-grid p { font-size: 1rem; margin-top: 10px; }
    }

    .quote-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      margin-top: 40px;
    }
    .quote-card {
      display: flex;
      flex-direction: column;
      padding: 30px 28px 26px;
      border-radius: 20px;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: 0 18px 60px rgba(0,0,0,.16);
    }
    .quote-card.is-legal { border-color: rgba(212,165,116,.34); }
    .quote-card.is-financial { border-color: rgba(74,94,127,.42); }
    .quote-card-tag {
      display: inline-flex;
      align-self: flex-start;
      padding: 4px 12px;
      margin-bottom: 16px;
      border-radius: 999px;
      background: rgba(212,165,116,.14);
      border: 1px solid rgba(212,165,116,.32);
      color: var(--gold);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .quote-card-tag.tag-financial {
      background: rgba(74,94,127,.18);
      border: 1px solid rgba(74,94,127,.4);
      color: #9db2d4;
    }
    .quote-card blockquote {
      margin: 0 0 22px;
      font-size: 1.04rem;
      line-height: 1.52;
      letter-spacing: -.015em;
      color: rgba(245,245,247,.92);
      font-weight: 500;
      font-style: italic;
    }
    .quote-card cite {
      margin-top: auto;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,.07);
      font-style: normal;
      display: block;
    }
    .quote-card .qc-name { color: var(--text); font-weight: 700; font-size: .96rem; letter-spacing: -.01em; }
    .quote-card .qc-title { margin-top: 3px; color: var(--gold); font-size: .85rem; line-height: 1.4; }
    @media (max-width: 980px) {
      .quote-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 620px) {
      .quote-grid { grid-template-columns: 1fr; }
    }

    .signature-card {
      margin-top: 36px;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255,255,255,.96) 0%, rgba(255,255,255,.86) 100%);
      border: 1px solid rgba(212,165,116,.32);
      box-shadow: 0 24px 70px rgba(0,0,0,.12), 0 0 0 1px rgba(212,165,116,.06) inset;
