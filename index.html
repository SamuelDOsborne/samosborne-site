<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sam Osborne | Conflict Transformation Speaker</title>

<style>
:root {
  --black: #0e0e0e;
  --gold: #d4a574;
  --white: #ffffff;
  --line: rgba(255,255,255,.08);
  --muted: rgba(255,255,255,.6);
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--black);
  color: var(--white);
}

/* NAV */

nav {
  position: sticky;
  top: 0;
  z-index: 1000;
  backdrop-filter: blur(18px) saturate(180%);
  background: rgba(26,26,26,.82);
  border-bottom: 1px solid var(--line);
}

.nav-inner {
  min-height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
}

.nav-brand {
  font-weight: 700;
  text-decoration: none;
  color: white;
}

.nav-links {
  display: flex;
  gap: 24px;
  font-size: 14px;
}

.nav-links a {
  color: var(--muted);
  text-decoration: none;
}

.nav-links a:hover {
  color: var(--gold);
}

.nav-cta {
  color: var(--gold);
  font-weight: 600;
  text-decoration: none;
}

/* MOBILE BUTTON */

.mobile-toggle {
  display: none;
  background: none;
  border: none;
  color: #fff;
  font-size: 24px;
  cursor: pointer;
  z-index: 1102;
}

/* MOBILE MENU */

.mobile-menu-backdrop {
  display: none;
}

/* HERO */

.hero {
  display: grid;
  grid-template-columns: 1fr 1fr;
  height: 100vh;
}

.hero-image {
  background: url('your-image.jpg') center/cover no-repeat;
}

.hero-copy {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 80px;
}

h1 {
  font-size: 56px;
}

/* MOBILE */

@media (max-width: 980px) {

  .hero {
    grid-template-columns: 1fr;
  }

  .mobile-toggle {
    display: block;
  }

  .nav-links {
    position: fixed;
    top: 56px;
    left: 16px;
    right: 16px;
    flex-direction: column;
    background: rgba(20,20,20,.96);
    border-radius: 16px;
    padding: 20px;
    display: none;
  }

  .nav-links.active {
    display: flex;
  }

  .nav-links a {
    padding: 14px 0;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }

  .mobile-menu-backdrop {
    position: fixed;
    inset: 56px 0 0 0;
    background: rgba(0,0,0,.3);
    display: none;
  }

  .mobile-menu-backdrop.active {
    display: block;
  }
}
</style>
</head>

<body>

<nav>
  <div class="nav-inner">

    <a href="#" class="nav-brand">Sam Osborne</a>

    <button id="menuToggle" class="mobile-toggle">&#9776;</button>

    <div class="nav-links" id="navLinks">
      <a href="#speaking">Speaking</a>
      <a href="#fit">Who It’s For</a>
      <a href="#method">The Method</a>
      <a href="#proof">Proof</a>
      <a href="advisory.html">Advisory</a>
      <a href="#contact" class="nav-cta">Check Availability</a>
    </div>

  </div>
</nav>

<div class="mobile-menu-backdrop" id="mobileMenuBackdrop"></div>

<section class="hero">
  <div class="hero-image"></div>

  <div class="hero-copy">
    <p style="color:var(--gold)">SAM OSBORNE</p>
    <h1>Conflict Transformation for Leaders</h1>
    <p>For leaders in high-stakes environments—where emotional triggers distort perception and undermine performance.</p>
  </div>
</section>

<script>
const mt = document.getElementById('menuToggle');
const nl = document.getElementById('navLinks');
const mb = document.getElementById('mobileMenuBackdrop');

function openMenu() {
  nl.classList.add('active');
  mb.classList.add('active');
  mt.innerHTML = '✕';
}

function closeMenu() {
  nl.classList.remove('active');
  mb.classList.remove('active');
  mt.innerHTML = '&#9776;';
}

mt.addEventListener('click', () => {
  nl.classList.contains('active') ? closeMenu() : openMenu();
});

mb.addEventListener('click', closeMenu);

nl.querySelectorAll('a').forEach(link => {
  link.addEventListener('click', closeMenu);
});
</script>

</body>
</html>
